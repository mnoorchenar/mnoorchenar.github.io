<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheat Sheets · Mohammad Noorchenarboo</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('mn-theme') || 'light')</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f8ef7'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23070d1f'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Segoe UI,system-ui,sans-serif' font-weight='900' font-size='26' fill='url(%23g)'%3EMN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root,[data-theme="dark"]{--body-bg:#070d1f;--text:#e2e8f0;--muted:#8892a4;--gold:#f59e0b;--glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.12);--bar-bg:rgba(7,13,31,.72)}
[data-theme="light"]{--body-bg:#eef1f8;--text:#1e2635;--muted:#5b6578;--gold:#b45309;--glass:rgba(20,30,60,0.06);--glass-border:rgba(20,30,60,0.14);--bar-bg:rgba(238,241,248,.8)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--body-bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}

.vwr-topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--bar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--glass-border)}
.vwr-back{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95em;white-space:nowrap}
.vwr-title{flex:1;text-align:center;font-weight:700;font-size:.95em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.vwr-counter{color:var(--muted);font-size:.85em;white-space:nowrap}

.vwr-stage{position:absolute;top:60px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.vwr-stage.zoomed{cursor:grab}
.vwr-stage:active{cursor:grabbing}
.vwr-stage.vwr-doc-mode{touch-action:auto;cursor:default}
#vwrImg{max-width:92vw;max-height:calc(88vh - 60px);user-select:none;-webkit-user-drag:none;will-change:transform;transition:transform .12s ease-out;box-shadow:0 20px 60px rgba(0,0,0,.35);border-radius:6px}
#vwrImg.dragging{transition:none}
#vwrFrameWrap{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff}
#vwrFrame{width:100%;height:100%;border:none;display:block;background:#fff}

.vwr-nav-group{display:flex;align-items:center;gap:8px;flex-shrink:0}
.vwr-arrow{width:32px;height:32px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95em}
.vwr-arrow:hover{background:var(--card-hover-bg,rgba(245,158,11,.15))}
.vwr-arrow[disabled]{opacity:.25;pointer-events:none}

.vwr-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:9;color:var(--muted);font-size:.78em;background:var(--bar-bg);padding:5px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none}
.vwr-hint.show{opacity:1}
.vwr-caption{color:var(--muted);font-weight:400}

.vwr-msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);text-align:center;padding:20px}
.vwr-msg i{font-size:2.2em;color:var(--gold);opacity:.7}
.vwr-msg a{color:var(--gold)}

@media (max-width:640px){
  .vwr-arrow{width:28px;height:28px;font-size:.85em}
  .vwr-title{font-size:.85em}
  .vwr-caption{display:none}
}
</style>
</head>
<body>

<div class="vwr-topbar">
  <a href="/" class="vwr-back"><i class="fas fa-arrow-left"></i> <span id="vwrBackLabel">Home</span></a>
  <div class="vwr-title"><span id="vwrTitle">Loading…</span><span class="vwr-caption" id="vwrCaption"></span></div>
  <div class="vwr-nav-group">
    <button class="vwr-arrow prev" id="vwrPrev" aria-label="Previous item"><i class="fas fa-chevron-left"></i></button>
    <div class="vwr-counter" id="vwrCounter"></div>
    <button class="vwr-arrow next" id="vwrNext" aria-label="Next item"><i class="fas fa-chevron-right"></i></button>
  </div>
</div>

<div class="vwr-stage" id="vwrStage">
  <img id="vwrImg" alt="" draggable="false">
  <div id="vwrFrameWrap" style="display:none">
    <iframe id="vwrFrame" title=""></iframe>
  </div>
</div>

<div class="vwr-hint" id="vwrHint">Use ← → to navigate</div>

<div class="vwr-msg" id="vwrMsg" style="display:none"></div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const sectionId = params.get('s');
  const subId = params.get('sub');
  const stage = document.getElementById('vwrStage');
  const img = document.getElementById('vwrImg');
  const frame = document.getElementById('vwrFrame');
  const frameWrap = document.getElementById('vwrFrameWrap');
  const msg = document.getElementById('vwrMsg');
  const hint = document.getElementById('vwrHint');

  const isDoc = src => /\.html?($|\?)/i.test(src);

  let images = [], captions = [], idx = 0;

  function showMsg(html) {
    msg.innerHTML = html;
    msg.style.display = 'flex';
    stage.style.display = 'none';
    document.querySelectorAll('.vwr-arrow').forEach(el => el.style.display = 'none');
  }

  function render() {
    const total = images.length;
    document.getElementById('vwrCounter').textContent = total ? `${idx + 1} / ${total}` : '';
    document.getElementById('vwrPrev').disabled = idx <= 0;
    document.getElementById('vwrNext').disabled = idx >= total - 1;
    const src = images[idx];
    const doc = isDoc(src);
    stage.classList.toggle('vwr-doc-mode', doc);
    if (doc) {
      img.style.display = 'none';
      frameWrap.style.display = 'block';
      frame.src = src;
    } else {
      frameWrap.style.display = 'none';
      frame.src = 'about:blank';
      img.style.display = 'block';
      img.src = src;
    }
    const caption = document.getElementById('vwrCaption');
    caption.textContent = captions[idx] ? ` · ${captions[idx]}` : '';
  }

  function go(delta) {
    const next = idx + delta;
    if (next < 0 || next >= images.length) return;
    idx = next;
    render();
  }

  document.getElementById('vwrPrev').addEventListener('click', () => go(-1));
  document.getElementById('vwrNext').addEventListener('click', () => go(1));
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
  });

  // Touch: swipe to navigate
  let touchStartX = 0, swiping = false;

  stage.addEventListener('touchstart', e => {
    swiping = e.touches.length === 1;
    if (swiping) touchStartX = e.touches[0].clientX;
  }, { passive: true });

  stage.addEventListener('touchend', e => {
    if (!swiping) return;
    const dx = (e.changedTouches[0]?.clientX || touchStartX) - touchStartX;
    if (Math.abs(dx) > 60) go(dx > 0 ? -1 : 1);
  });

  // Load manifest
  fetch('sections.json').then(r => r.json()).then(data => {
    const section = (data.sections || []).find(s => s.id === sectionId);
    const backHref = subId ? `category.html?s=${encodeURIComponent(sectionId)}` : '/';
    const backLabel = subId ? (section ? section.title : 'Category') : 'Home';
    document.querySelector('.vwr-back').setAttribute('href', backHref);
    document.getElementById('vwrBackLabel').textContent = backLabel;

    const target = subId
      ? (section && (section.subsections || []).find(sub => sub.id === subId))
      : section;

    if (!target || !(target.images || []).length) {
      showMsg(`<i class="fas fa-image"></i><div>This section isn't available yet.</div><a href="${backHref}">← Back</a>`);
      return;
    }
    images = target.images;
    captions = target.captions || [];
    const title = subId && section ? `${section.title} · ${target.title}` : target.title;
    document.getElementById('vwrTitle').textContent = title;
    document.title = title + ' · Cheat Sheets';
    render();
    setTimeout(() => hint.classList.add('show'), 300);
    setTimeout(() => hint.classList.remove('show'), 3500);
  }).catch(() => {
    const backHref = subId ? `category.html?s=${encodeURIComponent(sectionId)}` : '/';
    showMsg(`<i class="fas fa-triangle-exclamation"></i><div>Couldn't load this section.</div><a href="${backHref}">← Back</a>`);
  });
})();
</script>
</body>
</html>
