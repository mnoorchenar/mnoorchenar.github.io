(function () {
  const grid = document.getElementById('appsGrid');
  const input = document.getElementById('appSearch');
  const clearBtn = document.getElementById('clearSearch');
  const hint = document.getElementById('searchHint');
  const bar = document.getElementById('topicBar');
  const resultLine = document.getElementById('resultLine');
  const noResults = document.getElementById('noResults');
  let topic = 'All';

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  // searchable text per app: everything a visitor might type
  const apps = APPS_DATA.apps.map(a => ({
    ...a,
    haystack: norm([a.title, a.name, a.description, a.topic, a.tags.join(' '), a.keywords].join(' ')),
  }));

  function highlight(text, terms) {
    let out = esc(text);
    terms.forEach(t => {
      if (t.length < 2) return;
      const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      out = out.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag ? tag : txt.replace(re, '<mark>$1</mark>'));
    });
    return out;
  }

  function card(a, terms) {
    const demo = a.demo ? `<a class="app-btn app-btn-demo" href="${esc(a.demo)}" target="_blank" rel="noopener"><i class="fas fa-play"></i> Live Demo</a>` : '';
    return `<article class="app-card">
      <div class="app-head">
        <div class="app-emoji" aria-hidden="true">${esc(a.emoji || '🧩')}</div>
        <div><div class="app-topic">${esc(a.topic)}</div><div class="app-title">${highlight(a.title, terms)}</div></div>
      </div>
      <div class="app-desc">${highlight(a.description, terms)}</div>
      <div class="app-tags">${a.tags.map(t => `<span class="app-tag">${highlight(t, terms)}</span>`).join('')}</div>
      <div class="app-actions">${demo}
        <a class="app-btn" href="${esc(a.code)}" target="_blank" rel="noopener"><i class="fab fa-github"></i> Code</a>
      </div>
    </article>`;
  }

  function renderTopics() {
    const counts = {};
    apps.forEach(a => counts[a.topic] = (counts[a.topic] || 0) + 1);
    const list = ['All', ...APPS_DATA.topics.filter(t => counts[t])];
    bar.innerHTML = list.map(t => `<button class="topic-btn${t === topic ? ' active' : ''}" data-topic="${esc(t)}" aria-pressed="${t === topic}">${esc(t)}<span class="count">${t === 'All' ? apps.length : counts[t]}</span></button>`).join('');
  }

  function render() {
    const q = input.value.trim();
    const terms = norm(q).split(/\s+/).filter(Boolean);
    // each term must match the start of a word ("rag" finds RAG, not "average")
    const res = terms.map(t => new RegExp('(^|[^a-z0-9])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
    const shown = apps.filter(a => (topic === 'All' || a.topic === topic) && res.every(re => re.test(a.haystack)));
    grid.innerHTML = shown.map(a => card(a, terms)).join('');
    noResults.style.display = shown.length ? 'none' : 'block';
    resultLine.textContent = q || topic !== 'All'
      ? `${shown.length} of ${apps.length} apps` + (q ? ` matching “${q}”` : '') + (topic !== 'All' ? ` in ${topic}` : '')
      : `${apps.length} apps`;
    clearBtn.style.display = q ? 'block' : 'none';
    hint.style.display = q ? 'none' : '';
    const params = new URLSearchParams();
    if (q) params.set('q', q);
    if (topic !== 'All') params.set('topic', topic);
    history.replaceState(null, '', params.toString() ? `?${params}` : location.pathname);
  }

  bar.addEventListener('click', e => {
    const btn = e.target.closest('.topic-btn');
    if (!btn) return;
    topic = btn.dataset.topic;
    renderTopics(); render();
  });
  input.addEventListener('input', render);
  clearBtn.addEventListener('click', () => { input.value = ''; render(); input.focus(); });
  document.getElementById('resetBtn').addEventListener('click', () => { input.value = ''; topic = 'All'; renderTopics(); render(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
    if (e.key === 'Escape' && document.activeElement === input) { input.value = ''; render(); }
  });

  // restore ?q=…&topic=… so searches can be shared as links
  const params = new URLSearchParams(location.search);
  input.value = params.get('q') || '';
  if (APPS_DATA.topics.includes(params.get('topic'))) topic = params.get('topic');
  renderTopics(); render();
})();
</script>
