<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Notes · Mohammad Noorchenarboo</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('mn-theme') || 'light')</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f8ef7'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23070d1f'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Segoe UI,system-ui,sans-serif' font-weight='900' font-size='26' fill='url(%23g)'%3EMN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root,[data-theme="dark"]{
  --navy:#070d1f;--navy2:#0d1530;--body-bg:#070d1f;
  --accent:#4f8ef7;--accent2:#7c3aed;--teal:#06b6d4;--gold:#f59e0b;
  --text:#e2e8f0;--muted:#8892a4;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
  --card-hover-bg:rgba(255,255,255,0.06);--card-hover-border:rgba(245,158,11,.4);
  --radius:14px;--toggle-bg:rgba(255,255,255,0.08);--toggle-bdr:rgba(255,255,255,0.15);--toggle-clr:#fbbf24;
}
[data-theme="light"]{
  --navy:#f0f4ff;--navy2:#e8edf8;--body-bg:#f5f7ff;
  --accent:#2563eb;--accent2:#6d28d9;--teal:#0891b2;--gold:#b45309;
  --text:#1e2635;--muted:#5b6578;
  --glass:rgba(20,30,60,0.035);--glass-border:rgba(20,30,60,0.1);
  --card-hover-bg:rgba(20,30,60,0.05);--card-hover-border:rgba(180,83,9,.35);
  --toggle-bg:rgba(20,30,60,0.06);--toggle-bdr:rgba(20,30,60,0.15);--toggle-clr:#b45309;
}
*{box-sizing:border-box}
body{margin:0;background:var(--body-bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;transition:.25s}
.vn-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1100px;margin:0 auto}
.vn-logo{color:var(--text);text-decoration:none;font-weight:800;font-size:1.05em;display:flex;align-items:center;gap:8px}
.vn-logo i{color:var(--gold)}
.theme-toggle{display:flex;align-items:center;gap:6px;background:var(--toggle-bg);border:1px solid var(--toggle-bdr);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.85em}
.theme-toggle .toggle-moon{display:none}
[data-theme="dark"] .theme-toggle .toggle-sun{display:none}
[data-theme="dark"] .theme-toggle .toggle-moon{display:inline;color:var(--toggle-clr)}

.vn-hero{max-width:1100px;margin:0 auto;padding:28px 28px 8px;text-align:center}
.vn-hero h1{font-size:2.1em;margin:0 0 10px;background:linear-gradient(90deg,var(--gold),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.vn-hero p{color:var(--muted);max-width:640px;margin:0 auto;line-height:1.6}

.vn-grid{max-width:1100px;margin:32px auto 80px;padding:0 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.vn-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:var(--text);transition:.25s;display:flex;flex-direction:column}
.vn-card:hover{transform:translateY(-4px);border-color:var(--card-hover-border);background:var(--card-hover-bg)}
.vn-card-cover{aspect-ratio:4/3;background:var(--navy2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.vn-card-cover img{width:100%;height:100%;object-fit:cover}
.vn-card-cover i{font-size:2em;color:var(--muted)}
.vn-card-cover i.vn-topic-icon{font-size:3.4em;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.vn-card-body{padding:14px 16px}
.vn-card-title{font-weight:700;margin-bottom:4px}
.vn-card-meta{color:var(--muted);font-size:.82em}

.vn-empty{max-width:480px;margin:60px auto;text-align:center;color:var(--muted)}
.vn-empty i{font-size:2.4em;color:var(--gold);opacity:.7;margin-bottom:14px;display:block}

.vn-footer{text-align:center;color:var(--muted);font-size:.82em;padding:20px 20px 40px}
.vn-footer a{color:var(--accent)}
</style>
</head>
<body>

<nav class="vn-nav">
  <a href="/" class="vn-logo"><i class="fas fa-images"></i> Visual Notes</a>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">
    <span class="toggle-sun">☀️ Light</span>
    <span class="toggle-moon">🌙 Dark</span>
  </button>
</nav>

<div class="vn-hero">
  <h1>Visual Notes</h1>
  <p>Quick visual summaries and cheat sheets — one concept per picture. Browse a section as a slideshow: use the arrow keys, swipe on touch, or zoom in for detail.</p>
</div>

<div class="vn-grid" id="vnGrid"></div>
<div class="vn-empty" id="vnEmpty" style="display:none">
  <i class="fas fa-layer-group"></i>
  New sections are on the way — check back soon.
</div>

<div class="vn-footer"><a href="/">← Back to Home</a></div>

<script>
(function(){
  const btn = document.getElementById('themeToggle');
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('mn-theme', next);
  });

  fetch('sections.json').then(r => r.json()).then(data => {
    const sections = data.sections || [];
    const grid = document.getElementById('vnGrid');
    if (!sections.length) {
      document.getElementById('vnEmpty').style.display = 'block';
      return;
    }
    sections.forEach(s => {
      const a = document.createElement('a');
      a.className = 'vn-card';
      a.href = `viewer.html?s=${encodeURIComponent(s.id)}`;
      const count = (s.images || []).length;
      const coverContent = s.icon
        ? `<i class="${s.icon} vn-topic-icon"></i>`
        : s.cover
          ? `<img src="${s.cover}" alt="${s.title}" loading="lazy">`
          : '<i class="fas fa-image"></i>';
      a.innerHTML = `
        <div class="vn-card-cover">${coverContent}</div>
        <div class="vn-card-body">
          <div class="vn-card-title">${s.title}</div>
          <div class="vn-card-meta">${count} image${count === 1 ? '' : 's'}${s.description ? ' · ' + s.description : ''}</div>
        </div>`;
      grid.appendChild(a);
    });
  }).catch(() => {
    document.getElementById('vnEmpty').style.display = 'block';
  });
})();
</script>
</body>
</html>
